services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdev-change-me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_data:/data

  create-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 localdev localdev-change-me; do sleep 2; done;
      mc mb --ignore-existing local/portfolio-lab;
      '

  api:
    build: .
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: localdev
      AWS_SECRET_ACCESS_KEY: localdev-change-me
      AWS_DEFAULT_REGION: eu-west-3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: portfolio-lab
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  object_data:
