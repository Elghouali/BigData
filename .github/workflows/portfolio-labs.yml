name: Validate Big Data and Cloud portfolio labs

on:
  push:
    paths:
      - "projects/**"
      - ".github/workflows/portfolio-labs.yml"
  pull_request:
    paths:
      - "projects/**"
      - ".github/workflows/portfolio-labs.yml"

permissions:
  contents: read

jobs:
  pyspark-lakehouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/retail-pyspark-lakehouse
    env:
      SPARK_LOCAL_HOSTNAME: localhost
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PySpark tests
        run: python -m pytest -q
      - name: Execute sample pipeline
        run: python -m src.pipeline --input data/orders.csv --output output

  cloud-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cloud-object-store-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test API with fake S3 adapter
        run: python -m pytest -q
